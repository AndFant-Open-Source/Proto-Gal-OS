description:
  it:
    localisedName: ProtoGal - edizione per singolo GAL
    genericName: Registro di protocollo e repertorio contratti
    shortDescription: >-
      Registro di protocollo e repertorio contratti per GAL ed enti pubblici:
      una piattaforma e un database separati per ogni ente.
    longDescription: >-
      ProtoGal è un'applicazione web per la tenuta del registro di protocollo
      interno e del repertorio dei contratti di Gruppi di Azione Locale (GAL) e
      di piccoli enti pubblici. Permette di registrare i documenti in arrivo e in
      partenza con numerazione progressiva per anno (A/0001/2026 per
      l'entrata, U/0001/2026 per l'uscita), di allegare i file, di stampigliare il
      numero di protocollo sui PDF e di bloccare i protocolli già comunicati per
      escluderli dalla rinumerazione. Il repertorio contratti ha una numerazione
      separata (C/0001/2026) e registra contraente, importo, CIG, CUP e durata.
      Ogni ente ha la propria installazione, con un proprio database: nessun
      utente può vedere o gestire i dati di un altro ente. Ogni operazione resta
      nello storico.
    documentation: "https://github.com/AndFant-Open-Source/Proto-Gal-OS/tree/main/docs"
    features:
      - Protocollo in entrata e in uscita con numerazione progressiva per anno
      - Stampigliatura del numero di protocollo sugli allegati PDF
      - Blocco dei protocolli già comunicati, esclusi dalla rinumerazione
      - Repertorio contratti con numerazione separata
      - Un database separato per ogni ente, numerazione assegnata dal database
      - Ruoli amministratore, operatore e lettore
      - Storico delle azioni ed esportazione in Excel e PDF

